name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend
        env:
          RENDER_URL: ${{ vars.RENDER_BACKEND_URL || 'https://anapath-backend-ar7u-uj8n.onrender.com/api' }}
        run: |
          curl -fsS -o /dev/null --max-time 30 "$RENDER_URL" || echo "Backend en cold start ou injoignable (pas bloquant)"
