services:
  # Backend NestJS
  - type: web
    name: anapath-backend
    runtime: node
    plan: free
    rootDir: back_anapath
    buildCommand: npm install --include=dev && npm run build
    startCommand: node dist/main
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DB_HOST
        fromDatabase:
          name: anapath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: anapath-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: anapath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: anapath-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: anapath-db
          property: database
      - key: CHU_CMS_SERVICE_URL
        value: https://chu-service-cms7.onrender.com
      - key: SERVICE_SERVICE_URL
        value: https://service-service-0f7p.onrender.com
      - key: ACCUEIL_BASE_URL
        value: https://acceuil-back-ytyd.onrender.com
      - key: ANAPATH_SERVICE_ID
        value: 9e73904c-71e5-4477-9280-513e4112a468
      - key: NOTIFICATION_SERVICE_URL
        value: https://service-notification-nlqp.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://auth-service-4q6g.onrender.com
      - key: USER_SERVICES_URL
        value: https://user-services-0sze.onrender.com
      - key: PRESCRIPTION_SERVICE_URL
        value: https://prescriptionback-production.up.railway.app
      - key: PRESCRIPTION_SYNC_ENABLED
        value: "true"
      - key: PRESCRIPTION_SYNC_CRON
        value: "*/15 * * * *"
      - key: PRESCRIPTION_WS_ENABLED
        value: "true"
      # Compte de service utilisé par AuthServiceTokenService pour s'authentifier
      # automatiquement auprès du service Prescription (POST /auth/login). À créer
      # dans le dashboard Render (sync:false = ne pas écraser les valeurs manuelles).
      # Le code tolère aussi les variantes _MAIL/_PWD.
      - key: PRESCRIPTION_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: PRESCRIPTION_SERVICE_ACCOUNT_PASSWORD
        sync: false
      - key: UPLOAD_SERVICE_URL
        value: https://service-upload-u5z9.onrender.com
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: anapath-db
    plan: free
    databaseName: anapath_db
    user: anapath_user